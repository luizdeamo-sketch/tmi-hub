<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hub · Torre Metal Indústria</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  /* Hub da Torre Metal Indústria (Capacity Case): só o Luiz. Banco da Capacity Case, tabelas tmi_*. */
  :root { --ink: #0d1117; --ouro: #d7aa42; --fundo: #f6f5f1; --card: #fff; --linha: #e4e2db; --txt: #1d2330; --muted: #6b7180; --ok: #2f855a; --bad: #c0392b; --warn: #b7791f; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #0d1117; --card: #161b22; --linha: #2a313b; --txt: #e6e8eb; --muted: #9aa1ab; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 'DM Sans', system-ui, sans-serif; background: var(--fundo); color: var(--txt); }
  header { background: var(--ink); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font: 700 20px 'Syne', sans-serif; margin: 0; } header h1 b { color: var(--ouro); }
  header .sub { color: #aab; font-size: 13px; } header .esp { flex: 1; }
  main { padding: 20px 24px 60px; }
  h2 { font: 700 18px 'Syne', sans-serif; margin: 26px 0 10px; }
  .cartao { background: var(--card); border: 1px solid var(--linha); border-radius: 8px; padding: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--linha); border-radius: 8px; padding: 12px 14px; }
  .kpi .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; } .kpi .v { font: 700 24px 'Syne', sans-serif; }
  .kpi.hl { border-top: 3px solid var(--ouro); }
  table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--linha); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; } td.n, th.n { text-align: right; }
  tbody tr.clica { cursor: pointer; } tbody tr.clica:hover { background: rgba(215,170,66,.08); }
  .tbl { overflow-x: auto; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--linha); }
  .pill.ok { background: #e3f4ea; color: var(--ok); } .pill.warn { background: #fdf1dc; color: var(--warn); } .pill.no { background: #fbe4e1; color: var(--bad); }
  .btn { background: var(--ouro); color: var(--ink); border: 0; border-radius: 6px; padding: 8px 14px; font: 600 14px 'DM Sans', sans-serif; cursor: pointer; }
  .btn.fantasma { background: transparent; color: var(--txt); border: 1px solid var(--linha); } .btn.peq { padding: 4px 10px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px 14px; }
  label.campo { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select, textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--linha); border-radius: 6px; background: var(--card); color: var(--txt); }
  .mods { display: flex; flex-wrap: wrap; gap: 8px 16px; } .mods label { display: flex; gap: 6px; align-items: center; }
  .barra { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .aviso { padding: 10px 14px; border-radius: 6px; background: #fdf1dc; color: #6b4a10; margin: 10px 0; }
  .erro { background: #fbe4e1; color: #7a2016; }
  .login { max-width: 380px; margin: 60px auto; }
  .toast { position: fixed; bottom: 18px; right: 18px; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 6px; border-left: 3px solid var(--ouro); }
  .muted { color: var(--muted); font-size: 13px; }
  @media (max-width: 600px) { main { padding: 14px 16px 40px; } header { padding: 12px 16px; } }
</style>
</head>
<body>
<header><h1>Torre Metal <b>Indústria</b></h1><span class="sub">Hub da Capacity Case · gestão dos clientes</span><span class="esp"></span><span id="quem" class="sub"></span></header>
<main id="app"><p class="muted">Carregando…</p></main>
<script>
// Banco da Capacity Case (CRM_Alianca_CapacityCase), tabelas tmi_*. Chave publicável: só funciona com login de dono do hub (RLS tmi_dono + 2 etapas).
const sb = supabase.createClient('https://iuotvottnailofxbaynx.supabase.co', 'sb_publishable_LgS5rLTzl3NMfgGhlPEM_Q_eoP-NOhs',
  { auth: { storageKey: 'tmi-hub-sessao', persistSession: true } }) // sessão própria: não derruba o Aliança no mesmo navegador
const $ = (s) => document.querySelector(s)
const app = $('#app')
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const brl = (v) => (v == null || v === '' ? '—' : Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }))
const num = (t) => { if (t == null || String(t).trim() === '') return null; const s = String(t).trim(); const n = Number(s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s); return Number.isFinite(n) ? n : null }
const dataBR = (d) => (d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '—')
const hoje = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' })
const toast = (t, ruim) => { const e = document.createElement('div'); e.className = 'toast'; if (ruim) e.style.borderLeftColor = 'var(--bad)'; e.textContent = t; document.body.append(e); setTimeout(() => e.remove(), 4000) }
const STATUS = { implantacao: ['Implantação', 'warn'], ativo: ['Ativo', 'ok'], suspenso: ['Suspenso', 'no'], encerrado: ['Encerrado', ''] }
const LINK_SISTEMA = 'https://metal.capacitycase.com.br/?empresa=' // endereço definitivo (fase 2)
let D = { clientes: [], modulos: [], planos: [], mensalidades: [] }

async function inicio() {
  const { data: { session } } = await sb.auth.getSession()
  if (!session) return telaLogin()
  // 2 etapas: se a pessoa tem fator TOTP e a sessão ainda não passou por ele, pede o código
  const { data: aal } = await sb.auth.mfa.getAuthenticatorAssuranceLevel()
  if (aal && aal.nextLevel === 'aal2' && aal.currentLevel !== 'aal2') return telaCodigo()
  $('#quem').innerHTML = esc(session.user.email) + ' · <a href="#" id="sair" style="color:var(--ouro)">sair</a>'
  $('#sair').onclick = async (e) => { e.preventDefault(); await sb.auth.signOut({ scope: 'local' }); location.reload() }
  await carregar()
}

function telaLogin(msg) {
  app.innerHTML = `<div class="cartao login"><h2 style="margin-top:0">Entrar no hub</h2>
    ${msg ? `<div class="aviso erro">${esc(msg)}</div>` : ''}
    <form id="f" class="form" style="grid-template-columns:1fr">
      <label class="campo">E-mail<input name="email" type="email" required autocomplete="username"></label>
      <label class="campo">Senha<input name="senha" type="password" required autocomplete="current-password"></label>
      <button class="btn">Entrar</button></form>
    <p class="muted">Mesmo login do Painel da Plataforma da Capacity Case. Só os donos do hub entram.</p></div>`
  $('#f').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target)
    const { error } = await sb.auth.signInWithPassword({ email: f.get('email').trim(), password: f.get('senha') })
    if (error) return telaLogin(/Invalid login/i.test(error.message) ? 'E-mail ou senha incorretos.' : error.message)
    inicio()
  }
}

async function telaCodigo(msg) {
  app.innerHTML = `<div class="cartao login"><h2 style="margin-top:0">Verificação em 2 etapas</h2>
    ${msg ? `<div class="aviso erro">${esc(msg)}</div>` : ''}
    <form id="f" class="form" style="grid-template-columns:1fr"><label class="campo">Código do aplicativo autenticador<input name="c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus></label>
    <button class="btn">Confirmar</button></form></div>`
  $('#f').onsubmit = async (e) => {
    e.preventDefault()
    const { data: f } = await sb.auth.mfa.listFactors()
    const fator = f?.totp?.find((x) => x.status === 'verified')
    if (!fator) return telaCodigo('Nenhum autenticador cadastrado neste login.')
    const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: fator.id, code: new FormData(e.target).get('c').trim() })
    if (error) return telaCodigo('Código inválido. Tente de novo.')
    inicio()
  }
}

async function carregar() {
  const [c, m, p, ms] = await Promise.all([
    sb.from('tmi_clientes').select('*').order('nome'),
    sb.from('tmi_modulos').select('*').order('ordem'),
    sb.from('tmi_planos').select('*').order('nome'),
    sb.from('tmi_mensalidades').select('*').order('vencimento', { ascending: false }),
  ])
  const erro = c.error || m.error || p.error || ms.error
  if (erro) { app.innerHTML = `<div class="aviso erro">Não deu para ler o hub: ${esc(erro.message)}</div>`; return }
  if (!c.data.length && !m.data.length) { app.innerHTML = `<div class="aviso erro">Este login não é dono do hub (ou falta a verificação em 2 etapas).</div>`; return }
  D = { clientes: c.data, modulos: m.data, planos: p.data, mensalidades: ms.data }
  painel()
}

const precoDoCliente = (cl) => {
  if (cl.preco_combinado != null) return Number(cl.preco_combinado)
  const plano = D.planos.find((p) => p.id === cl.plano_id)
  if (plano?.preco_base == null) return null
  const extras = (cl.modulos || []).map((id) => D.modulos.find((m) => m.id === id)?.preco_mensal)
  if (extras.some((v) => v == null)) return null
  return Number(plano.preco_base) + extras.reduce((t, v) => t + Number(v), 0)
}

function painel() {
  const ativos = D.clientes.filter((c) => c.status === 'ativo')
  const mrr = ativos.reduce((t, c) => t + (precoDoCliente(c) ?? 0), 0)
  const semPreco = ativos.filter((c) => precoDoCliente(c) == null).length
  const atrasadas = D.mensalidades.filter((x) => !x.pago_em && x.vencimento < hoje())
  const mes = hoje().slice(0, 7)
  app.innerHTML = `
    <div class="kpis">
      <div class="kpi hl"><div class="l">Clientes ativos</div><div class="v">${ativos.length}</div><div class="muted">${D.clientes.length} no total</div></div>
      <div class="kpi"><div class="l">Receita mensal (ativos)</div><div class="v">${brl(mrr)}</div><div class="muted">${semPreco ? `${semPreco} sem preço definido` : 'plano + módulos'}</div></div>
      <div class="kpi"><div class="l">Mensalidades em atraso</div><div class="v" style="color:${atrasadas.length ? 'var(--bad)' : 'inherit'}">${atrasadas.length}</div><div class="muted">${brl(atrasadas.reduce((t, x) => t + Number(x.valor), 0))}</div></div>
      <div class="kpi"><div class="l">Em implantação</div><div class="v">${D.clientes.filter((c) => c.status === 'implantacao').length}</div></div>
    </div>
    <h2>Clientes</h2>
    <div class="cartao tbl"><table><thead><tr><th>Empresa</th><th>Status</th><th>Plano e módulos</th><th class="n">Mensalidade</th><th>Banco</th><th>Vence dia</th></tr></thead><tbody>
      ${D.clientes.map((c) => `<tr class="clica" data-id="${c.id}"><td><b>${esc(c.nome)}</b><div class="muted">${esc(c.nome_exibicao)} · código <b>${esc(c.codigo)}</b></div></td>
        <td><span class="pill ${STATUS[c.status]?.[1] ?? ''}">${STATUS[c.status]?.[0] ?? c.status}</span></td>
        <td>${esc(D.planos.find((p) => p.id === c.plano_id)?.nome ?? '—')}<div class="muted">${(c.modulos || []).map((id) => esc(D.modulos.find((m) => m.id === id)?.nome ?? id)).join(' · ') || 'só a base'}</div></td>
        <td class="n">${brl(precoDoCliente(c))}${c.preco_combinado != null ? '<div class="muted">combinado</div>' : ''}</td>
        <td>${c.supabase_ref ? `<span class="muted">${esc(c.supabase_ref)}</span><div class="muted">versão ${esc(c.versao_banco ?? '—')}</div>` : '<span class="pill warn">falta criar</span>'}</td>
        <td>${c.dia_vencimento ?? '—'}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="barra"><button class="btn" id="novo">+ Novo cliente</button></div>
    <div id="editor"></div>

    <h2>Mensalidades</h2>
    <div class="cartao">
      <div class="barra" style="margin-top:0"><label class="campo" style="flex-direction:row;align-items:center;gap:8px">Competência <input type="month" id="comp" value="${mes}"></label>
        <button class="btn fantasma" id="gerar">Gerar mensalidades dos ativos</button><span class="muted">Usa o preço de cada cliente e o dia de vencimento. Não repete o que já existe.</span></div>
      <div class="tbl" style="margin-top:10px"><table><thead><tr><th>Competência</th><th>Cliente</th><th class="n">Valor</th><th>Vencimento</th><th>Situação</th><th></th></tr></thead><tbody>
        ${D.mensalidades.slice(0, 60).map((x) => { const cl = D.clientes.find((c) => c.id === x.cliente_id); const atraso = !x.pago_em && x.vencimento < hoje()
          return `<tr><td>${esc(x.competencia)}</td><td>${esc(cl?.nome ?? '—')}</td><td class="n">${brl(x.valor)}</td><td>${dataBR(x.vencimento)}</td>
          <td>${x.pago_em ? `<span class="pill ok">Pago ${dataBR(x.pago_em)}</span>` : atraso ? '<span class="pill no">Em atraso</span>' : '<span class="pill warn">Em aberto</span>'}</td>
          <td>${x.pago_em ? '' : `<button class="btn peq" data-pagar="${x.id}">Marcar pago</button>`}</td></tr>` }).join('') || '<tr><td colspan="6" class="muted">Nenhuma mensalidade gerada ainda.</td></tr>'}
      </tbody></table></div>
    </div>

    <h2>Tabela de preços</h2>
    <div class="cartao tbl"><table><thead><tr><th>Item</th><th>O que inclui</th><th class="n">R$/mês</th></tr></thead><tbody>
      ${D.planos.map((p) => `<tr><td><b>Plano ${esc(p.nome)}</b> (base)</td><td class="muted">${esc(p.descricao ?? '')}</td><td class="n"><input data-plano="${p.id}" inputmode="decimal" style="width:110px;text-align:right" value="${p.preco_base ?? ''}" placeholder="definir"></td></tr>`).join('')}
      ${D.modulos.filter((m) => !m.base).map((m) => `<tr><td>${esc(m.nome)}</td><td class="muted">${esc(m.descricao ?? '')}</td><td class="n"><input data-modulo="${m.id}" inputmode="decimal" style="width:110px;text-align:right" value="${m.preco_mensal ?? ''}" placeholder="definir"></td></tr>`).join('')}
    </tbody></table><div class="barra"><button class="btn" id="precos">Salvar preços</button><span class="muted">Base inclui: ${D.modulos.filter((m) => m.base).map((m) => esc(m.nome)).join(', ')}.</span></div></div>`

  app.querySelectorAll('tr[data-id]').forEach((tr) => (tr.onclick = () => editor(D.clientes.find((c) => c.id === tr.dataset.id))))
  $('#novo').onclick = () => editor(null)
  $('#gerar').onclick = gerarMensalidades
  $('#precos').onclick = salvarPrecos
  app.querySelectorAll('[data-pagar]').forEach((b) => (b.onclick = () => marcarPago(Number(b.dataset.pagar))))
}

function editor(c) {
  const novo = !c
  c = c || { codigo: '', nome: '', nome_exibicao: 'Torre de Controle - ', status: 'implantacao', plano_id: D.planos[0]?.id, modulos: [] }
  $('#editor').innerHTML = `<div class="cartao" style="margin-top:12px"><h2 style="margin-top:0">${novo ? 'Novo cliente' : esc(c.nome)}</h2>
    <form id="fc" class="form">
      <label class="campo">Código (vai no link)<input name="codigo" value="${esc(c.codigo)}" ${novo ? '' : 'readonly'} required pattern="[a-z0-9-]{2,30}" placeholder="ex.: bracon"></label>
      <label class="campo">Empresa<input name="nome" value="${esc(c.nome)}" required></label>
      <label class="campo">Nome no sistema<input name="nome_exibicao" value="${esc(c.nome_exibicao)}" required></label>
      <label class="campo">Status<select name="status">${Object.entries(STATUS).map(([k, [n]]) => `<option value="${k}" ${c.status === k ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <label class="campo">Mensagem quando suspenso<input name="mensagem_suspensao" value="${esc(c.mensagem_suspensao ?? '')}" placeholder="Acesso suspenso. Fale com a Capacity Case."></label>
      <label class="campo">Plano<select name="plano_id">${D.planos.map((p) => `<option value="${p.id}" ${c.plano_id === p.id ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></label>
      <label class="campo">Preço combinado (R$/mês, opcional)<input name="preco_combinado" inputmode="decimal" value="${c.preco_combinado ?? ''}" placeholder="vazio = tabela"></label>
      <label class="campo">Dia do vencimento<input name="dia_vencimento" inputmode="numeric" value="${c.dia_vencimento ?? ''}" placeholder="1 a 28"></label>
      <label class="campo">CNPJ<input name="cnpj" value="${esc(c.cnpj ?? '')}"></label>
      <label class="campo">Contato<input name="contato_nome" value="${esc(c.contato_nome ?? '')}"></label>
      <label class="campo">E-mail do contato<input name="contato_email" type="email" value="${esc(c.contato_email ?? '')}"></label>
      <label class="campo">Banco (ref do Supabase)<input name="supabase_ref" value="${esc(c.supabase_ref ?? '')}" placeholder="criado na implantação"></label>
      <label class="campo">Chave publicável do banco<input name="supabase_chave_publica" value="${esc(c.supabase_chave_publica ?? '')}" placeholder="sb_publishable_…"></label>
      <label class="campo">Versão do banco<input name="versao_banco" value="${esc(c.versao_banco ?? '')}"></label>
      <label class="campo" style="grid-column:1/-1">Observações<textarea name="observacoes" rows="2">${esc(c.observacoes ?? '')}</textarea></label>
      <div style="grid-column:1/-1"><div class="muted" style="margin-bottom:6px">Módulos adicionais (a base vem sempre: ${D.modulos.filter((m) => m.base).map((m) => esc(m.nome)).join(', ')})</div>
        <div class="mods">${D.modulos.filter((m) => !m.base).map((m) => `<label><input type="checkbox" name="mod" value="${m.id}" ${(c.modulos || []).includes(m.id) ? 'checked' : ''}> ${esc(m.nome)} <span class="muted">${m.preco_mensal != null ? brl(m.preco_mensal) : ''}</span></label>`).join('')}</div></div>
    </form>
    ${!novo && c.codigo ? `<p class="muted">Link do sistema (quando a fase 2 estiver no ar): <b>${LINK_SISTEMA}${esc(c.codigo)}</b></p>` : ''}
    <div class="barra"><button class="btn" id="salvar">Salvar</button><button class="btn fantasma" id="fechar">Fechar</button></div></div>`
  $('#fechar').onclick = () => ($('#editor').innerHTML = '')
  $('#salvar').onclick = async () => {
    const f = new FormData($('#fc'))
    const reg = Object.fromEntries([...f.entries()].filter(([k]) => k !== 'mod'))
    for (const k of Object.keys(reg)) if (reg[k] === '') reg[k] = null
    reg.modulos = f.getAll('mod')
    reg.preco_combinado = num(reg.preco_combinado); reg.dia_vencimento = reg.dia_vencimento ? Number(reg.dia_vencimento) : null
    if (reg.dia_vencimento != null && !(reg.dia_vencimento >= 1 && reg.dia_vencimento <= 28)) return toast('Dia do vencimento: de 1 a 28.', true)
    if (reg.supabase_ref) reg.supabase_url = `https://${reg.supabase_ref}.supabase.co`
    if (reg.status === 'suspenso' && c.status !== 'suspenso' && !confirm(`Suspender ${reg.nome}? Quem usa o sistema passa a ver só o aviso.`)) return
    reg.atualizado_em = new Date().toISOString()
    const r = novo ? await sb.from('tmi_clientes').insert(reg) : await sb.from('tmi_clientes').update(reg).eq('id', c.id)
    if (r.error) return toast(r.error.message, true)
    toast('Cliente salvo'); await carregar()
  }
  $('#editor').scrollIntoView({ behavior: 'smooth' })
}

async function salvarPrecos() {
  for (const i of app.querySelectorAll('[data-plano]')) { const r = await sb.from('tmi_planos').update({ preco_base: num(i.value) }).eq('id', i.dataset.plano); if (r.error) return toast(r.error.message, true) }
  for (const i of app.querySelectorAll('[data-modulo]')) { const r = await sb.from('tmi_modulos').update({ preco_mensal: num(i.value) }).eq('id', i.dataset.modulo); if (r.error) return toast(r.error.message, true) }
  toast('Preços salvos'); await carregar()
}

async function gerarMensalidades() {
  const comp = $('#comp').value
  if (!comp) return
  const ativos = D.clientes.filter((c) => c.status === 'ativo')
  const faltaPreco = ativos.filter((c) => precoDoCliente(c) == null || !c.dia_vencimento)
  const novos = ativos.filter((c) => precoDoCliente(c) != null && c.dia_vencimento && !D.mensalidades.some((x) => x.cliente_id === c.id && x.competencia === comp))
  if (!novos.length) return toast(faltaPreco.length ? `Nada a gerar: ${faltaPreco.length} cliente(s) sem preço ou sem dia de vencimento.` : 'As mensalidades deste mês já existem.', !!faltaPreco.length)
  const total = novos.reduce((t, c) => t + precoDoCliente(c), 0)
  if (!confirm(`Gerar ${novos.length} mensalidade(s) de ${comp}, total ${brl(total)}?${faltaPreco.length ? `\n${faltaPreco.length} cliente(s) ficam de fora por falta de preço ou dia de vencimento.` : ''}`)) return
  const linhas = novos.map((c) => ({ cliente_id: c.id, competencia: comp, valor: precoDoCliente(c), vencimento: `${comp}-${String(c.dia_vencimento).padStart(2, '0')}` }))
  const r = await sb.from('tmi_mensalidades').insert(linhas)
  if (r.error) return toast(r.error.message, true)
  toast(`${novos.length} mensalidade(s) geradas`); await carregar()
}

async function marcarPago(id) {
  const d = prompt('Pago em (AAAA-MM-DD):', hoje())
  if (!d || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return
  const r = await sb.from('tmi_mensalidades').update({ pago_em: d }).eq('id', id)
  if (r.error) return toast(r.error.message, true)
  toast('Mensalidade marcada como paga'); await carregar()
}

inicio()
